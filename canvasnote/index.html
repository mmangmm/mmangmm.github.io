<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>캔버스 노트</title>
<style>
  :root { --desk:#f3f1ee; --paper:#fbfaf8; --ink:#262626; --faint:rgba(38,38,38,.45); --line:rgba(38,38,38,.08); --note:#f6eac3; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--desk); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; overflow:hidden; }
  header { position:fixed; inset:0 0 auto 0; height:56px; display:flex; align-items:center; gap:12px; padding:0 20px;
    background:var(--paper); border-bottom:1px solid var(--line); z-index:10; }
  header h1 { font-size:18px; font-weight:600; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  header .crumb { color:var(--faint); font-size:15px; cursor:pointer; white-space:nowrap; }
  header .spacer { flex:1; }
  header .made { color:var(--faint); font-size:13px; white-space:nowrap; }
  #stage { position:fixed; inset:56px 0 0 0; overflow:hidden; touch-action:none; cursor:grab; }
  #stage.dragging { cursor:grabbing; }
  #board { position:absolute; left:0; top:0; transform-origin:0 0; background:var(--paper); box-shadow:0 1px 12px rgba(0,0,0,.06); }
  #board.dots { background-image:radial-gradient(rgba(38,38,38,.16) 1.4px, transparent 1.6px); background-size:32px 32px; }
  svg.layer { position:absolute; left:0; top:0; overflow:visible; pointer-events:none; }
  .card { position:absolute; }
  .card.link { background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 3px 8px rgba(0,0,0,.08); border:1px solid rgba(0,0,0,.06); text-decoration:none; color:inherit; display:block; }
  .card.link img { width:100%; object-fit:cover; display:block; }
  .card.video .vbox { background:#000 center/cover no-repeat; display:flex; align-items:center; justify-content:center; }
  .card.video .vplay { width:56px; height:56px; border-radius:28px; background:rgba(0,0,0,.55); color:#fff; font-size:24px; display:flex; align-items:center; justify-content:center; padding-left:4px; }
  .card.link .lt { font-weight:600; font-size:16px; padding:14px 16px 4px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
  .card.link .lh { font-size:13px; color:rgba(43,43,43,.5); padding:0 16px 14px; }
  .note { background:var(--note); border-radius:6px; padding:16px 18px; box-shadow:0 2px 8px rgba(0,0,0,.08);
    font-size:17px; line-height:1.45; white-space:pre-wrap; overflow:hidden; }
  .note b { display:block; font-size:19px; margin-bottom:4px; }
  .image { border-radius:8px; overflow:hidden; box-shadow:0 2px 10px rgba(0,0,0,.12); background:#e9e6e1; cursor:zoom-in; }
  .image.slot { background:rgba(38,38,38,.05); box-shadow:none; border:1.5px dashed rgba(38,38,38,.15); cursor:default; }
  .image img { width:100%; height:100%; object-fit:cover; display:block; }
  .profile { background:#fff; border-radius:12px; padding:24px 28px; box-shadow:0 2px 12px rgba(0,0,0,.08); overflow:hidden; }
  .profile h2 { margin:0 0 8px; font-size:30px; font-weight:700; }
  .profile p { margin:0 0 12px; font-size:17px; line-height:1.5; white-space:pre-wrap; color:rgba(38,38,38,.8); }
  .profile .plain { display:block; font-size:15px; color:rgba(38,38,38,.7); }
  .profile a { display:block; color:#4578bf; font-size:15px; text-decoration:none; margin-top:2px; pointer-events:auto; }
  .cover { border-radius:4px 10px 10px 4px; box-shadow:0 3px 10px rgba(0,0,0,.16); position:relative; overflow:hidden; }
  .cover .label { position:absolute; left:14px; right:14px; top:22px; color:rgba(255,255,255,.92); font-size:15px; font-weight:600; }
  .cover.paper { border-radius:6px; border:1px solid var(--line); }
  .cover.paper .label { color:var(--ink); }
  .title { text-align:center; font-size:15px; margin-top:8px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .icon { display:flex; flex-direction:column; align-items:center; }
  .folder-shape { width:76px; height:58px; margin-top:6px; background:#3d3c3a; border-radius:6px; position:relative; }
  .folder-shape::before { content:""; position:absolute; left:0; top:-7px; width:32px; height:12px; background:#3d3c3a; border-radius:4px 4px 0 0; }
  .doc-shape { width:50px; height:64px; margin-top:6px; background:#fff; border:1px solid rgba(38,38,38,.18); border-radius:4px; }
  .clickable { cursor:pointer; }
  [hidden] { display:none !important; }
  header #play { border:0; background:rgba(38,38,38,.07); border-radius:999px; padding:7px 14px; font-size:15px; cursor:pointer; color:var(--ink); }
  body.playing header, body.playing #zoom { display:none !important; }
  body.playing #stage { inset:0; cursor:default; }
  #controls { position:fixed; left:50%; bottom:20px; transform:translateX(-50%); display:none; align-items:center; gap:2px; padding:4px 6px;
    background:var(--paper); border-radius:999px; box-shadow:0 2px 10px rgba(0,0,0,.12); z-index:15; transition:opacity .6s; }
  body.playing #controls { display:flex; }
  #controls.sleep { opacity:.12; }
  #controls button { border:0; background:none; font-size:18px; width:40px; height:36px; cursor:pointer; color:rgba(38,38,38,.75); }
  #controls button:disabled { opacity:.3; cursor:default; }
  #controls span { min-width:56px; text-align:center; font-size:14px; color:rgba(38,38,38,.7); font-variant-numeric:tabular-nums; }
  #message { position:fixed; inset:56px 0 0 0; display:flex; align-items:center; justify-content:center; color:var(--faint); font-size:16px; text-align:center; padding:24px; }
  #zoom { position:fixed; right:16px; bottom:16px; display:flex; gap:4px; background:var(--paper); border-radius:12px; padding:4px;
    box-shadow:0 2px 10px rgba(0,0,0,.1); z-index:10; }
  #zoom button { border:0; background:none; font-size:20px; width:40px; height:36px; cursor:pointer; color:rgba(38,38,38,.7); }
  /* 포트폴리오 — 표지 한 장, 그 뒤엔 캔버스만(확대 · 이동만, 도구 막대 없음) */
  body.portfolio header, body.portfolio #zoom { display:none !important; }
  body.portfolio #stage, body.portfolio #message { inset:0; }
  #cover { position:fixed; inset:0; z-index:30; display:none; flex-direction:column; justify-content:flex-end;
    padding:clamp(28px, 7vw, 96px); background:var(--paper) center/cover no-repeat; color:var(--ink);
    transition:opacity .5s, transform .5s; }
  #cover.on { display:flex; }
  #cover.leaving { opacity:0; transform:scale(1.02); pointer-events:none; }
  #cover.light { color:#fff; }
  #cover.photo::before { content:""; position:absolute; inset:0; background:linear-gradient(rgba(0,0,0,.08), rgba(0,0,0,.6)); }
  #cover > * { position:relative; max-width:880px; }
  #cover h1 { font-size:clamp(40px, 8vw, 88px); font-weight:700; line-height:1.05; margin:0 0 20px; letter-spacing:-.02em; word-break:keep-all; }
  #cover .intro { font-size:clamp(17px, 2.2vw, 22px); line-height:1.6; margin:0 0 24px; white-space:pre-wrap; opacity:.85; word-break:keep-all; }
  #cover .contact a, #cover .contact span { display:inline-block; margin:0 18px 6px 0; font-size:16px; color:inherit; opacity:.75; text-decoration:none; }
  #cover .contact a:hover { opacity:1; text-decoration:underline; }
  #cover .go { display:flex; gap:10px; margin-top:28px; flex-wrap:wrap; }
  #cover .go button { border:0; border-radius:999px; padding:13px 24px; font-size:16px; font-weight:600; cursor:pointer;
    background:var(--ink); color:#fff; font-family:inherit; }
  #cover.light .go button { background:#fff; color:#222; }
  #cover .go button.ghost { background:transparent; color:inherit; box-shadow:inset 0 0 0 1.5px currentColor; }
  #cover .credit { position:absolute; right:20px; bottom:16px; font-size:12px; opacity:.4; }
  #home { position:fixed; left:16px; top:16px; z-index:12; width:40px; height:40px; border:0; border-radius:50%;
    background:rgba(251,250,248,.85); box-shadow:0 1px 6px rgba(0,0,0,.12); font-size:22px; line-height:1; cursor:pointer; color:var(--ink);
    display:none; backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); }
  body.portfolio #home { display:block; }
  body.portfolio.playing #home { display:none; }
  .profile.dark h2, .profile.dark p, .profile.dark a, .profile.dark span { color:#fff !important; }
  .profile.photo { background-size:cover; background-position:center; display:flex; flex-direction:column; justify-content:flex-end; }
  #viewer { position:fixed; inset:0; background:rgba(0,0,0,.92); display:none; align-items:center; justify-content:center; z-index:20; }
  #viewer.on { display:flex; }
  #viewer img { max-width:96vw; max-height:92vh; object-fit:contain; }
  #viewer .nav { position:absolute; top:50%; transform:translateY(-50%); color:#fff; font-size:40px; background:none; border:0; cursor:pointer; padding:20px; opacity:.8; }
  #viewer .prev { left:4px; } #viewer .next { right:4px; }
  /* 문서 읽기 — 마크다운을 꾸며 보인다 */
  #docview { position:fixed; inset:0; background:rgba(30,28,24,.45); display:none; align-items:center; justify-content:center; z-index:21; }
  #docview.on { display:flex; }
  #docview .sheet { background:var(--paper, #fbfaf7); width:min(720px, 94vw); max-height:88vh; overflow:auto; border-radius:16px;
    padding:28px 32px 40px; box-shadow:0 20px 60px rgba(0,0,0,.25); position:relative; color:#2b2b2b; line-height:1.65; font-size:17px; }
  #docview .sheet h1.doc-title { font-size:26px; margin:0 0 14px; }
  #docview .md h1 { font-size:26px; margin:18px 0 6px; } #docview .md h2 { font-size:21px; margin:16px 0 4px; } #docview .md h3 { font-size:18px; margin:14px 0 4px; }
  #docview .md p { margin:4px 0; } #docview .md ul, #docview .md ol { margin:4px 0; padding-left:24px; }
  #docview .md li.task { list-style:none; margin-left:-22px; } #docview .md li.task.done { color:#999; text-decoration:line-through; }
  #docview .md li.task .box { display:inline-block; width:15px; height:15px; border:1.6px solid #c8553d; border-radius:4px; margin-right:8px; vertical-align:-2px; text-align:center; font-size:12px; line-height:13px; color:#fff; }
  #docview .md li.task.done .box { background:#c8553d; border-color:#c8553d; text-decoration:none; }
  #docview .md blockquote { margin:6px 0; padding-left:12px; border-left:3px solid #ddd; color:#777; }
  #docview .md code { background:rgba(0,0,0,.06); padding:1px 5px; border-radius:4px; font-size:15px; }
  #docview .md a { color:#c8553d; }
  #docview .md table { border-collapse:collapse; margin:10px 0; font-size:15px; }
  #docview .md th, #docview .md td { border:1px solid rgba(38,38,38,.15); padding:6px 12px; text-align:left; }
  #docview .md th { background:rgba(38,38,38,.04); font-weight:600; }
  #docview .md hr { border:0; border-top:1px solid rgba(38,38,38,.15); margin:16px 0; }
  #docview .md .callout { background:rgba(200,85,61,.10); border-radius:10px; padding:10px 14px; margin:8px 0; }
  #docview .md pre { background:rgba(38,38,38,.05); border-radius:8px; padding:10px 14px; overflow:auto; font-size:14px; }
  #docview .md details { margin:6px 0; } #docview .md details > *:not(summary) { margin-left:18px; }
  #docview .md summary { cursor:pointer; font-weight:600; }
  #docview .cover-img { height:180px; border-radius:14px; background:center/cover no-repeat; margin-bottom:14px; }
  #docview .md a.cardlink { text-decoration:none; background:rgba(200,85,61,.08); border-radius:3px; padding:0 2px; }
  #docview .md a.cardlink.missing { color:#999; background:none; cursor:default; }
  #docview .close { position:sticky; float:right; top:0; font-size:24px; background:none; border:0; cursor:pointer; color:#555; }
  #lock { position:fixed; inset:0; background:var(--desk); display:flex; align-items:center; justify-content:center; z-index:80; }
  #lock form { background:var(--paper); border-radius:18px; padding:28px; width:min(360px, 90vw); box-shadow:0 6px 30px rgba(0,0,0,.08); text-align:center; }
  #lock h2 { font-size:18px; margin:0 0 16px; }
  #lock input { width:100%; font-size:17px; padding:12px; border-radius:10px; border:1px solid var(--line); margin-bottom:12px; }
  #lock button { width:100%; font-size:16px; font-weight:600; padding:12px; border:0; border-radius:10px; background:#c8553d; color:#fff; cursor:pointer; }
  #lock .err { color:#c8553d; font-size:14px; min-height:1em; margin:10px 0 0; }
  #pages { position:fixed; inset:0; background:rgba(38,34,28,.55); display:none; flex-direction:column; z-index:60; }
  #pages.on { display:flex; }
  #pages .bar { display:flex; align-items:center; gap:12px; padding:12px 18px; background:var(--paper); border-bottom:1px solid var(--line); }
  #pages .bar h2 { margin:0; font-size:17px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #pages .bar select { font:inherit; font-size:14px; padding:6px 10px; border-radius:10px; border:1px solid var(--line); background:#fff; max-width:42vw; }
  #pages .bar .count { color:var(--faint); font-size:13px; white-space:nowrap; }
  #pages .bar button { font-size:20px; background:none; border:0; cursor:pointer; color:var(--ink); padding:4px 8px; }
  #pages .stage { flex:1; display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; padding:16px; }
  #pages .paper { background:#fff; box-shadow:0 6px 30px rgba(0,0,0,.25); max-width:100%; max-height:100%; display:block; }
  #pages .nav { position:absolute; top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:24px; border:0; background:rgba(251,250,248,.92);
    font-size:26px; cursor:pointer; color:var(--ink); box-shadow:0 2px 10px rgba(0,0,0,.15); }
  #pages .prev { left:16px; } #pages .next { right:16px; }
  #pages .note { color:#fff; font-size:15px; text-align:center; line-height:1.6; }
  #viewer .close { position:absolute; top:12px; right:16px; color:#fff; font-size:28px; background:none; border:0; cursor:pointer; }
</style>
</head>
<body>
<header>
  <span class="crumb" id="back" hidden>‹</span>
  <h1 id="name">캔버스 노트</h1>
  <span class="spacer"></span>
  <button id="play" hidden>▶ 발표</button>
  <span class="made">캔버스 노트로 만들었어요</span>
</header>
<div id="stage"><div id="board"></div></div>
<div id="message">불러오는 중…</div>
<div id="zoom" hidden><button id="zout" aria-label="작게">−</button><button id="zfit" aria-label="전체 보기">⤢</button><button id="zin" aria-label="크게">+</button></div>
<div id="controls"><button id="prev" aria-label="이전">‹</button><span id="count"></span><button id="next" aria-label="다음">›</button><button id="stop" aria-label="발표 끝내기">✕</button></div>
<div id="cover"><h1></h1><p class="intro"></p><div class="contact"></div>
  <div class="go"><button id="enter">작업 보기 →</button><button id="enterPlay" class="ghost" hidden>▶ 발표로 보기</button></div>
  <span class="credit">캔버스 노트로 만들었어요</span></div>
<button id="home" aria-label="뒤로">‹</button>
<div id="docview"><div class="sheet"><button class="close" aria-label="닫기">✕</button><h1 class="doc-title"></h1><div class="md"></div></div></div>
<div id="pages"><div class="bar"><h2></h2><select aria-label="쪽 고르기"></select><span class="count"></span><span style="flex:1"></span><button class="close" aria-label="닫기">✕</button></div>
  <div class="stage"><button class="nav prev" aria-label="이전 쪽">‹</button><div class="holder"></div><button class="nav next" aria-label="다음 쪽">›</button></div></div>
<div id="viewer"><button class="close" aria-label="닫기">✕</button><button class="nav prev" aria-label="이전">‹</button><img alt=""><button class="nav next" aria-label="다음">›</button></div>
<script>
// 공개한 캔버스를 읽기만 하는 웹 열람 — 로그인 없이, 앱에 넣는 공개 키로 읽는다(서버 규칙이 공개한 것만 보여 준다)
const SUPABASE = "https://xkqwwvllljrukkhpxucz.supabase.co";
const KEY = "sb_publishable_Fm_38DGJmZ0hMA9EHc8FAQ_G4YkxO0m";
const BOARD_W = 4800, BOARD_H = 3200;
const LINE_COLORS = { gray:"rgba(38,38,38,.3)", ink:"rgba(38,38,38,.8)", red:"rgb(209,84,69)", blue:"rgb(69,120,191)", green:"rgb(92,148,97)", yellow:"rgb(224,173,51)" };

const $ = id => document.getElementById(id);
const shareID = new URLSearchParams(location.search).get("s");
let boards = {}, items = {}, connectors = {}, documents = {}, rootID = null, currentID = null, stack = [];
let view = { x:0, y:0, z:1 };
let portfolio = false;
const imageCache = {};

// 비밀번호가 걸린 웹 링크 — 맞춘 비밀번호를 요청 머리에 실어 보낸다(서버 규칙이 확인한다)
let sharePassword = "", shareLocked = false;
async function rest(path) {
  const headers = { apikey: KEY };
  if (sharePassword) headers["x-share-password"] = sharePassword;
  const r = await fetch(`${SUPABASE}/rest/v1/${path}`, { headers });
  if (!r.ok) throw new Error(await r.text());
  return r.json();
}
async function rpc(name, body) {
  const r = await fetch(`${SUPABASE}/rest/v1/rpc/${name}`, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  if (!r.ok) throw new Error(await r.text());
  return r.status === 204 ? null : r.json();
}
async function fileURL(path) {
  if (shareLocked && !imageCache[path]) {
    // 저장소 규칙에는 머리가 닿지 않아 서명 주소를 받아 쓴다
    imageCache[path] = fetch(`${SUPABASE}/functions/v1/share-files`, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" },
      body: JSON.stringify({ share: shareID, password: sharePassword, paths: [path] }) })
      .then(r => r.ok ? r.json() : null).then(j => j?.urls?.[path] || null).catch(() => null);
  }
  if (!imageCache[path]) {
    imageCache[path] = fetch(`${SUPABASE}/storage/v1/object/authenticated/files/${path.split("/").map(encodeURIComponent).join("/")}`, { headers: { apikey: KEY } })
      .then(r => r.ok ? r.blob() : null).then(b => b ? URL.createObjectURL(b) : null);
  }
  return imageCache[path];
}

async function load() {
  if (!shareID) return fail("링크가 올바르지 않아요.");
  try {
    const shares = await rest(`shares?id=eq.${encodeURIComponent(shareID)}&is_public=eq.true&select=id,title,workspace_id,root_id`);
    if (!shares.length) return fail("공개가 끝났거나 없는 캔버스예요.");
    const share = shares[0];
    // 비밀번호가 걸렸으면 먼저 묻는다(서버에 이 기능이 없으면 그냥 지나간다)
    shareLocked = await rpc("share_locked", { share: shareID }).catch(() => false);
    if (shareLocked) {
      sharePassword = sessionStorage.getItem("cn-pw-" + shareID) || "";
      if (!sharePassword || !(await rpc("share_unlock", { share: shareID, password: sharePassword }).catch(() => false))) {
        sharePassword = await askPassword();
        sessionStorage.setItem("cn-pw-" + shareID, sharePassword);
      }
    }
    // 조회수(이 창에서 한 번)
    if (!sessionStorage.getItem("cn-view-" + shareID)) {
      sessionStorage.setItem("cn-view-" + shareID, "1");
      rpc("record_share_view", { share: shareID }).catch(() => {});
    }
    // 이름은 작업 공간의 지금 이름(공개한 뒤 바꿨어도)
    const ws = await rest(`workspaces?id=eq.${share.workspace_id}&select=name,kind,diary_document_id`);
    diaryDocumentID = lower(ws[0]?.diary_document_id);
    share.title = ws[0]?.name || share.title;
    portfolio = ws[0]?.kind === "portfolio";
    if (portfolio) document.body.classList.add("portfolio");
    document.title = share.title + " · 캔버스 노트";
    const q = `workspace_id=eq.${share.workspace_id}&deleted=eq.false`;
    const [b, i, c, d] = await Promise.all([
      rest(`boards?${q}&select=id,parent_id,name,background,drawing,slides`),
      rest(`items?${q}&select=id,board_id,data`),
      rest(`connectors?${q}&select=id,board_id,data`),
      rest(`documents?${q}&select=id,kind,data`),
    ]);
    b.forEach(x => { boards[x.id] = x; items[x.id] = []; connectors[x.id] = []; });
    i.forEach(x => (items[x.board_id] ||= []).push(x.data));
    c.forEach(x => (connectors[x.board_id] ||= []).push(x.data));
    d.forEach(x => documents[x.data.id?.toLowerCase?.() ?? x.id] = x.data);
    rootID = share.root_id;
    if (!boards[rootID]) boards[rootID] = { id: rootID, name: share.title };
    boards[rootID].name = share.title;
    $("message").hidden = true;
    $("zoom").hidden = false;
    open(rootID, false);
    if (portfolio) showCover();
  } catch (e) {
    console.error(e);

// 비밀번호 묻기 — 맞을 때까지
function askPassword() {

const lower = v => (v || "").toLowerCase();

// 카드의 몸체 한가운데(앱의 BoardItem.anchor와 같다)
function anchor(it) {
  switch (it.kind) {
    case "notebook": case "diary": case "pdf": return [it.x + it.width / 2, it.y + it.width * (it.aspect || 1.414) / 2];
    case "document": return [it.x + it.width / 2, it.y + 38];
    case "folder": return [it.x + it.width / 2, it.y + 32];
    default: return [it.x + it.width / 2, it.y + it.height / 2];

}
function color(hex) {
  const h = (hex || "#262626FF").replace("#", "");
  const n = parseInt(h.slice(0, 6), 16), a = h.length >= 8 ? parseInt(h.slice(6, 8), 16) / 255 : 1;
  return `rgba(${n >> 16 & 255},${n >> 8 & 255},${n & 255},${a.toFixed(3)})`;
}
function esc(s) { return (s || "").replace(/[&<>"]/g, ch => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[ch]); }
function link(line) {
  const t = line.trim();
  if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(t)) return `<a href="mailto:${esc(t)}">${esc(t)}</a>`;
  if (/^https?:\/\//i.test(t)) return `<a href="${esc(t)}" target="_blank" rel="noopener">${esc(t.replace(/^https?:\/\//i, ""))}</a>`;
  if (/^[\w.-]+\.[a-z]{2,}(\/\S*)?$/i.test(t)) return `<a href="https://${esc(t)}" target="_blank" rel="noopener">${esc(t)}</a>`;
  return `<span class="plain">${esc(t)}</span>`;
}

// 소개 카드의 바탕 — 사진(있으면) 또는 색. 글자는 어두운 바탕이면 희게

// 포트폴리오 표지 — 맨 위 캔버스의 소개 카드

function render() {
  const el = $("board");
  el.innerHTML = "";

  el.style.height = BOARD_H + "px";

  for (const c of connectors[currentID] || []) {

      case "image": {

        break;
      }
      case "link": {

        const child = lower(it.childBoardID);

}

// 보는 자리 — 화면 = 이동 + 판 × 배율
function apply() { $("board").style.transform = `translate(${view.x}px,${view.y}px) scale(${view.z})`; }

  const list = items[currentID] || [];
  const stage = $("stage").getBoundingClientRect();
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  if (list.length) {
    x0 = Math.min(...list.map(i => i.x)); y0 = Math.min(...list.map(i => i.y));
    x1 = Math.max(...list.map(i => i.x + i.width)); y1 = Math.max(...list.map(i => i.y + Math.max(i.height, i.width * (i.aspect || 0))));
  }
  for (const st of boards[currentID]?.drawing || []) for (const v of st.points || []) {
    x0 = Math.min(x0, v[0]); y0 = Math.min(y0, v[1]); x1 = Math.max(x1, v[0]); y1 = Math.max(y1, v[1]);
  }
  if (!isFinite(x0)) { x0 = 0; y0 = 0; x1 = BOARD_W; y1 = BOARD_H; }

  const z = Math.min((stage.width - pad * 2) / (x1 - x0), (stage.height - pad * 2) / (y1 - y0), 1.5);
  view = { z, x: (stage.width - (x1 - x0) * z) / 2 - x0 * z, y: (stage.height - (y1 - y0) * z) / 2 - y0 * z };

}

// 끌었으면 카드 누름으로 치지 않는다
stage.addEventListener("click", e => { if (moved > 6) e.stopPropagation(); }, true);

$("zout").onclick = () => { const r = stage.getBoundingClientRect(); zoomAt(0.8, r.width / 2, r.height / 2); };
$("zfit").onclick = fit;
addEventListener("resize", () => { if (playing !== null) place(slides()[playing]); else fit(); });

// 발표 — 앱에서 정한 장면(판 위의 네모)을 순서대로, 누를 때마다 날아가며 확대한다(앱의 Presentation.swift와 같은 움직임)
let playing = null, flight = 0, sleepTimer = 0;

function place(r) {

}
function wake() {
  $("controls").classList.remove("sleep");
  clearTimeout(sleepTimer);
  sleepTimer = setTimeout(() => $("controls").classList.add("sleep"), 2500);
}
function startPlaying() {
  if (!slides().length) return;
  playing = 0;
  document.body.classList.add("playing");
  document.documentElement.requestFullscreen?.().catch(() => {});
  // 위 막대가 사라져 화면이 커진 뒤에 난다
  requestAnimationFrame(() => { fly(slides()[0]); show(); });
}
function stopPlaying() {
  if (playing === null) return;
  playing = null;
  stopFlight();
  document.body.classList.remove("playing");
  if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
  requestAnimationFrame(fit);
}
function step(d) {
  if (playing === null) return;

  playing = next;
  fly(slides()[playing]);
  show();

$("play").onclick = startPlaying;
$("prev").onclick = () => step(-1);
$("next").onclick = () => step(1);
$("stop").onclick = stopPlaying;
$("controls").addEventListener("pointerdown", wake);
// 발표 중 빈 곳을 누르면 다음 장면(카드는 그대로 열린다)
stage.addEventListener("click", e => {
  if (playing === null || e.target.closest(".clickable, a")) return;
  step(1);
});
document.addEventListener("fullscreenchange", () => { if (!document.fullscreenElement && playing !== null) stopPlaying(); });
addEventListener("keydown", e => {
  if (playing === null || viewer.classList.contains("on")) return;
  if (["ArrowRight", "PageDown", " "].includes(e.key)) { e.preventDefault(); step(1); }
  if (["ArrowLeft", "PageUp"].includes(e.key)) { e.preventDefault(); step(-1); }
  if (e.key === "Escape") stopPlaying();
});

// 사진 크게 보기 — 이 캔버스의 사진을 넘겨 본다
// 문서 — 앱과 같은 마크다운(제목 · 굵게 · 기울임 · 취소선 · 코드 · 링크 · 목록 · 번호 · 할 일 · 인용)
function inlineMd(t) {
  let h = esc(t);
  h = h.replace(/`([^`]+)`/g, "<code>$1</code>")
       .replace(/\[\[([^\[\]\n]+)\]\]/g, (_, t) => `<a href="#" class="cardlink" data-title="${t.trim()}">${t}</a>`)
       .replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, (_, label, url) => `<a href="${/^[a-z]+:\/\//i.test(url) ? url : "https://" + url}" target="_blank" rel="noopener">${label}</a>`)
       .replace(/(^|[\s(])(https?:\/\/[^\s<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>')
       .replace(/\*\*(\S(?:.*?\S)?)\*\*/g, "<b>$1</b>")
       .replace(/~~(\S(?:.*?\S)?)~~/g, "<s>$1</s>")
       .replace(/(^|[^*])\*([^*\s](?:[^*\n]*?[^*\s])?)\*(?!\*)/g, "$1<i>$2</i>");
  return h;
}
function renderMd(text) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  const open = tag => { if (list !== tag) { close(); out.push(`<${tag}>`); list = tag; } };
  const lines = (text || "").split("\n");
  for (let n = 0; n < lines.length; n++) {
    const line = lines[n];
    let m;
    // 코드 묶음
    if (/^```/.test(line)) {
      close();
      const body = [];
      while (++n < lines.length && !/^```/.test(lines[n])) body.push(lines[n]);
      out.push(`<pre><code>${esc(body.join("\n"))}</code></pre>`);
      continue;
    }
    // 표 — 이어진 | 줄들
    if (/^\s*\|.*\|\s*$/.test(line)) {
      close();
      const rows = [];
      while (n < lines.length && /^\s*\|.*\|\s*$/.test(lines[n])) rows.push(lines[n++]);
      n--;
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      const isRule = r => cells(r).every(c => /^:?-{2,}:?$/.test(c));
      const body = rows.filter(r => !isRule(r));
      const head = rows.length > 1 && isRule(rows[1]) ? body.shift() : null;
      out.push(`<table>${head ? `<thead><tr>${cells(head).map(c => `<th>${inlineMd(c)}</th>`).join("")}</tr></thead>` : ""}<tbody>${
        body.map(r => `<tr>${cells(r).map(c => `<td>${inlineMd(c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
      continue;
    }
    // 접는 목록 — ▾ 펼침 · ▸ 접힘, 아래 들여 쓴 줄들이 안쪽
    if ((m = line.match(/^([▾▸])[ \t]+(.*)$/))) {
      close();
      const inner = [];
      while (n + 1 < lines.length && /^(  |\t)/.test(lines[n + 1])) inner.push(lines[++n].replace(/^(  |\t)/, ""));
      out.push(`<details${m[1] === "▾" ? " open" : ""}><summary>${inlineMd(m[2])}</summary>${renderMd(inner.join("\n"))}</details>`);
      continue;
    }
    if (/^\s*(-{3,}|\*{3,})\s*$/.test(line)) { close(); out.push("<hr>"); }
    else if ((m = line.match(/^>[ \t]?\[![^\]]*\][ \t]?(.*)$/))) { close(); out.push(`<div class="callout">${inlineMd(m[1])}</div>`); }
    else if ((m = line.match(/^(#{1,3})[ \t]+(.*)$/))) { close(); out.push(`<h${m[1].length}>${inlineMd(m[2])}</h${m[1].length}>`); }
    else if ((m = line.match(/^[ \t]*[-*+][ \t]+\[([ xX])\][ \t]*(.*)$/))) { open("ul"); const done = m[1] !== " ";
      out.push(`<li class="task${done ? " done" : ""}"><span class="box">${done ? "✓" : ""}</span>${inlineMd(m[2])}</li>`); }
    else if ((m = line.match(/^[ \t]*[-*+][ \t]+(.*)$/))) { open("ul"); out.push(`<li>${inlineMd(m[1])}</li>`); }
    else if ((m = line.match(/^[ \t]*\d+\.[ \t]+(.*)$/))) { open("ol"); out.push(`<li>${inlineMd(m[1])}</li>`); }
    else if ((m = line.match(/^>[ \t]?(.*)$/))) { close(); out.push(`<blockquote>${inlineMd(m[1])}</blockquote>`); }
    else if (!line.trim()) { close(); out.push("<p>&nbsp;</p>"); }
    else { close(); out.push(`<p>${inlineMd(line)}</p>`); }
  }
  close();
  return out.join("");
}
const docview = $("docview");
function showDoc(it) {
  docview.querySelector(".doc-title").textContent = it.title || "";
  docview.querySelector(".md").innerHTML = renderMd(it.text || "");
  // 문서 스타일 — 글꼴 · 커버 사진
  const sheet = docview.querySelector(".sheet");
  sheet.style.fontFamily = ({ serif: '"AppleMyungjo", "Nanum Myeongjo", "Noto Serif KR", serif', mono: "ui-monospace, Menlo, monospace",
    rounded: 'ui-rounded, "SF Pro Rounded", -apple-system, sans-serif' })[it.docFont] || "";
  let cover = sheet.querySelector(".cover-img");
  if (!cover) { cover = document.createElement("div"); cover.className = "cover-img"; sheet.insertBefore(cover, sheet.querySelector(".doc-title")); }
  cover.style.display = "none";
  if (it.filePath) fileURL(it.filePath).then(u => { if (u) { cover.style.backgroundImage = `url("${u}")`; cover.style.display = "block"; } });
  docview.classList.add("on");
}
// [[제목]] — 같은 캔버스의 카드로: 문서면 열고, 다른 카드는 그 카드가 있는 캔버스를 연다
docview.querySelector(".md").addEventListener("click", e => {
  const a = e.target.closest("a.cardlink");
  if (!a) return;
  e.preventDefault();
  const want = a.dataset.title.toLowerCase();
  for (const [bid, list] of Object.entries(items)) {
    const it = list.find(x => (x.title || "").trim().toLowerCase() === want);
    if (!it) continue;
    if (it.kind === "document") { showDoc(it); return; }
    docview.classList.remove("on");
    if (bid !== currentID) open(bid);
    return;
  }
  a.classList.add("missing");
});
docview.querySelector(".close").onclick = () => docview.classList.remove("on");
docview.onclick = e => { if (e.target === docview) docview.classList.remove("on"); };
document.addEventListener("keydown", e => { if (e.key === "Escape" && docview.classList.contains("on")) docview.classList.remove("on"); });

// ── 노트북 · 다이어리 · PDF 쪽 넘겨 보기 ─────────────────────────────
// 노트북 · 다이어리: 앱이 뜬 쪽 그림(pages.extra.image). 아직 없으면 손글씨만 빈 종이에.
// PDF: 원본(documents.data.remotePath)을 pdf.js로 그리고 그 위에 손글씨(종이 폭 1000 단위)를 겹친다.
let diaryDocumentID = null;
const pagesView = $("pages");
let pageList = [], pageAt = 0, pageDoc = null, pageKind = "", pdfDoc = null;
const pad = n => String(n).padStart(2, "0");
function pageLabel(key) {
  let m;
  if ((m = key.match(/^Y-(\d{4})$/))) return `${m[1]}년`;
  if ((m = key.match(/^M-(\d{4})-(\d{2})$/))) return `${+m[2]}월`;
  if ((m = key.match(/^W-(\d{4})-(\d{2})-(\d{2})$/))) return `${+m[2]}월 ${+m[3]}일 주`;
  if ((m = key.match(/^D-(\d{4})-(\d{2})-(\d{2})$/))) return `${+m[2]}월 ${+m[3]}일`;
  if ((m = key.match(/(\d{4})$/)) && key.startsWith("N-")) return `${pageKind === "diary" ? "노트 " : ""}${+m[1]}${pageKind === "diary" ? "" : "쪽"}`;
  if ((m = key.match(/^p(\d+)$/))) return `${+m[1] + 1}쪽`;
  return key;
}
function pageOrder(key) {
  let m;
  if ((m = key.match(/^Y-(\d{4})$/))) return `${m[1]}-00-00-0`;
  if ((m = key.match(/^M-(\d{4})-(\d{2})$/))) return `${m[1]}-${m[2]}-00-1`;
  if ((m = key.match(/^W-(\d{4})-(\d{2})-(\d{2})$/))) return `${m[1]}-${m[2]}-${m[3]}-2`;
  if ((m = key.match(/^D-(\d{4})-(\d{2})-(\d{2})$/))) return `${m[1]}-${m[2]}-${m[3]}-3`;
  return "z" + key;
}
async function showPages(it, doc) {
  pageKind = it.kind; pageDoc = doc; pdfDoc = null;
  pagesView.querySelector("h2").textContent = doc.title || it.title || (it.kind === "diary" ? "다이어리" : "노트북");
  const holder = pagesView.querySelector(".holder");
  holder.innerHTML = `<div class="note">불러오는 중…</div>`;
  pagesView.classList.add("on");
  try {
    if (it.kind === "pdf") {
      const count = (doc.pdfPageSizes || []).length;
      const rows = await rest(`pages?document_id=eq.${lower(it.documentID)}&deleted=eq.false&select=key,strokes`);
      const ink = Object.fromEntries(rows.map(r => [r.key, r.strokes]));
      pageList = Array.from({ length: count }, (_, i) => ({ key: `p${i}`, strokes: ink[`p${i}`] || [] }));
    } else {
      const docID = it.kind === "diary" ? diaryDocumentID : lower(it.documentID);
      if (!docID) throw new Error("none");
      let rows = await rest(`pages?document_id=eq.${docID}&deleted=eq.false&select=key,extra`);
      if (it.kind === "diary" && doc.year) rows = rows.filter(r => !/^[YMWD]-/.test(r.key) || r.key.slice(2, 6) === String(doc.year));
      rows.sort((a, b) => pageOrder(a.key) < pageOrder(b.key) ? -1 : 1);
      pageList = rows.map(r => ({ key: r.key, image: r.extra?.image, theme: r.extra?.theme || "", docID }));
    }
  } catch (e) { pageList = []; }
  const select = pagesView.querySelector("select");
  select.innerHTML = pageList.map((p, i) => `<option value="${i}">${esc(pageLabel(p.key))}</option>`).join("");
  if (!pageList.length) { holder.innerHTML = `<div class="note">아직 쓴 쪽이 없거나 올라가지 않았어요.<br>앱에서 쪽을 고치면 곧 보여요.</div>`; return; }
  showPage(0);
}
async function showPage(i) {
  pageAt = Math.max(0, Math.min(pageList.length - 1, i));
  const p = pageList[pageAt];
  pagesView.querySelector("select").value = pageAt;
  pagesView.querySelector(".count").textContent = `${pageAt + 1} / ${pageList.length}`;
  pagesView.querySelector(".prev").hidden = pageAt === 0;
  pagesView.querySelector(".next").hidden = pageAt === pageList.length - 1;
  const holder = pagesView.querySelector(".holder");
  const stage = pagesView.querySelector(".stage").getBoundingClientRect();
  const maxW = stage.width - 140, maxH = stage.height - 32;
  if (pageKind === "pdf") return showPdfPage(p, holder, maxW, maxH);
  if (p.image) {
    const url = await fileURL(p.image);
    if (pageList[pageAt] !== p) return;
    if (url) { holder.innerHTML = ""; const img = new Image(); img.className = "paper"; img.src = url;
      img.style.maxWidth = maxW + "px"; img.style.maxHeight = maxH + "px"; holder.appendChild(img); return; }
  }
  // 그림이 아직 없다 — 손글씨만
  if (!p.strokes) {
    const rows = await rest(`pages?document_id=eq.${p.docID}&key=eq.${encodeURIComponent(p.key)}&select=strokes`);
    p.strokes = rows[0]?.strokes || [];
    if (pageList[pageAt] !== p) return;
  }
  const portrait = /vertical|portrait/i.test(p.theme);
  drawPaper(holder, 1180, portrait ? 1514 : 840, p.strokes, 1, maxW, maxH);
}
function drawPaper(holder, w, h, strokes, unit, maxW, maxH, under) {
  const k = Math.min(maxW / w, maxH / h);
  const canvas = document.createElement("canvas");
  const dpr = window.devicePixelRatio || 1;
  canvas.width = Math.round(w * k * dpr); canvas.height = Math.round(h * k * dpr);
  canvas.style.width = Math.round(w * k) + "px"; canvas.style.height = Math.round(h * k) + "px";
  canvas.className = "paper";
  const ctx = canvas.getContext("2d");
  ctx.fillStyle = "#fffdf8"; ctx.fillRect(0, 0, canvas.width, canvas.height);
  if (under) ctx.drawImage(under, 0, 0, canvas.width, canvas.height);
  drawInk(ctx, strokes, k * dpr * unit);
  holder.innerHTML = ""; holder.appendChild(canvas);
}
function drawInk(ctx, strokes, scale) {
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  for (const s of strokes || []) {
    const pts = s.points || [];
    if (!pts.length) continue;
    ctx.strokeStyle = color(s.color);
    ctx.globalAlpha = s.tool === "marker" ? 0.4 : 1;
    for (let i = 1; i < pts.length; i++) {
      ctx.lineWidth = Math.max(0.6, (pts[i][3] || s.width || 2) * scale * (s.tool === "pen" || s.tool === "monoline" ? 0.55 : 0.7));
      ctx.beginPath(); ctx.moveTo(pts[i - 1][0] * scale, pts[i - 1][1] * scale); ctx.lineTo(pts[i][0] * scale, pts[i][1] * scale); ctx.stroke();
    }
    if (pts.length === 1) { ctx.beginPath(); ctx.arc(pts[0][0] * scale, pts[0][1] * scale, (s.width || 2) * scale / 2, 0, 7); ctx.fillStyle = ctx.strokeStyle; ctx.fill(); }
  }
  ctx.globalAlpha = 1;
}
let pdfjsReady = null;
function loadPdfjs() {
  if (!pdfjsReady) pdfjsReady = new Promise((ok, no) => {
    const tag = document.createElement("script");
    tag.src = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js";
    tag.onload = () => { pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"; ok(); };
    tag.onerror = no; document.head.appendChild(tag);
  });
  return pdfjsReady;
}
async function showPdfPage(p, holder, maxW, maxH) {
  const index = +p.key.slice(1);
  const size = (pageDoc.pdfPageSizes || [])[index] || [1, 1.414];
  const pw = 1000, ph = 1000 * (size[1] ?? size.height) / (size[0] ?? size.width);
  let under = null;
  try {
    if (!pdfDoc && pageDoc.remotePath) {
      await loadPdfjs();
      const url = await fileURL(pageDoc.remotePath);
      if (url) pdfDoc = await pdfjsLib.getDocument(url).promise;
    }
    if (pdfDoc) {
      const page = await pdfDoc.getPage(index + 1);
      const k = Math.min(maxW / pw, maxH / ph) * (window.devicePixelRatio || 1);
      const vp = page.getViewport({ scale: k * pw / page.getViewport({ scale: 1 }).width });
      under = document.createElement("canvas"); under.width = vp.width; under.height = vp.height;
      await page.render({ canvasContext: under.getContext("2d"), viewport: vp }).promise;
    }
  } catch (e) { console.error(e); }
  if (pageList[pageAt] !== p) return;
  drawPaper(holder, pw, ph, p.strokes, 1, maxW, maxH, under);
}
pagesView.querySelector(".close").onclick = () => pagesView.classList.remove("on");
pagesView.querySelector(".prev").onclick = () => showPage(pageAt - 1);
pagesView.querySelector(".next").onclick = () => showPage(pageAt + 1);
pagesView.querySelector("select").onchange = e => showPage(+e.target.value);
document.addEventListener("keydown", e => {
  if (!pagesView.classList.contains("on")) return;
  if (e.key === "Escape") pagesView.classList.remove("on");
  if (e.key === "ArrowRight") showPage(pageAt + 1);
  if (e.key === "ArrowLeft") showPage(pageAt - 1);
});

const viewer = $("viewer");
let shown = [], at = 0;
async function showPhoto(list, index) {
  shown = list; at = index;
  viewer.classList.add("on");
  const it = shown[at];
  viewer.querySelector("img").src = it.filePath ? (await fileURL(it.filePath)) || "" : "";
  viewer.querySelector(".prev").hidden = at === 0;
  viewer.querySelector(".next").hidden = at === shown.length - 1;
}
viewer.querySelector(".close").onclick = () => viewer.classList.remove("on");
viewer.querySelector(".prev").onclick = e => { e.stopPropagation(); if (at > 0) showPhoto(shown, at - 1); };
viewer.querySelector(".next").onclick = e => { e.stopPropagation(); if (at < shown.length - 1) showPhoto(shown, at + 1); };
viewer.onclick = e => { if (e.target === viewer) viewer.classList.remove("on"); };
addEventListener("keydown", e => {
  if (!viewer.classList.contains("on")) return;
  if (e.key === "Escape") viewer.classList.remove("on");
  if (e.key === "ArrowLeft" && at > 0) showPhoto(shown, at - 1);
  if (e.key === "ArrowRight" && at < shown.length - 1) showPhoto(shown, at + 1);
});

load();
</script>
