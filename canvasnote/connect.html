<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>캔버스 노트에 AI 연결</title>
<style>
  :root { --desk:#f3f1ee; --paper:#fbfaf8; --ink:#262626; --faint:rgba(38,38,38,.5); --line:rgba(38,38,38,.1); --accent:#c8553d; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--desk); color:var(--ink);
    font-family:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", sans-serif; padding:24px; }
  main { width:100%; max-width:420px; background:var(--paper); border-radius:18px; padding:32px 28px; box-shadow:0 6px 30px rgba(0,0,0,.07); }
  h1 { font-size:22px; margin:0 0 6px; }
  .who { font-size:15px; color:var(--faint); margin:0 0 22px; line-height:1.5; }
  .who b { color:var(--ink); }
  ol { margin:0 0 22px; padding-left:20px; font-size:15px; line-height:1.7; }
  label { display:block; font-size:13px; color:var(--faint); margin-bottom:6px; }
  input { width:100%; font-size:24px; letter-spacing:.12em; text-align:center; text-transform:uppercase; padding:14px; border-radius:12px;
    border:1px solid var(--line); background:#fff; color:var(--ink); font-family:ui-monospace, Menlo, monospace; }
  input:focus { outline:2px solid var(--accent); border-color:transparent; }
  button { width:100%; margin-top:14px; font-size:17px; font-weight:600; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#fff; cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  .cancel { background:none; color:var(--faint); font-weight:500; margin-top:6px; }
  .error { color:var(--accent); font-size:14px; margin-top:12px; min-height:1.2em; }
  .scope { font-size:13px; color:var(--faint); line-height:1.6; margin-top:20px; border-top:1px solid var(--line); padding-top:16px; }
</style>
</head>
<body>
<main>
  <h1>캔버스 노트에 연결</h1>
  <p class="who" id="who"></p>
  <ol>
    <li>아이패드의 <b>캔버스 노트</b>를 여세요.</li>
    <li><b>… 메뉴 → AI 연결 → 연결 코드 받기</b>를 누르세요.</li>
    <li>나온 8자 코드를 아래에 넣으세요.</li>
  </ol>
  <form id="form">
    <label for="code">연결 코드</label>
    <input id="code" autocomplete="one-time-code" autocapitalize="characters" spellcheck="false" maxlength="9" placeholder="ABCD-EFGH" required>
    <button id="go" type="submit">연결하기</button>
    <button class="cancel" id="cancel" type="button">연결하지 않기</button>
    <div class="error" id="error"></div>
  </form>
  <p class="scope">연결하면 이 AI가 내 캔버스 · 카드 · 문서를 읽고, 카드를 만들고 고치고 지울 수 있어요(지운 카드는 되살릴 수 있어요).
    캔버스 노트 앱의 AI 연결 화면에서 언제든 끊을 수 있어요.</p>
</main>
<script>
const MCP = "https://xkqwwvllljrukkhpxucz.supabase.co/functions/v1/mcp";
const params = new URLSearchParams(location.search);
const redirect = params.get("redirect_uri") || "";
let host = "";
try { host = new URL(redirect).host; } catch {}
const name = params.get("client_name") || host || "AI 앱";
const who = document.getElementById("who");
if (!redirect || !params.get("code_challenge")) {
  who.textContent = "연결 정보가 없어요. Claude · ChatGPT의 커넥터 화면에서 다시 연결해 주세요.";
  document.getElementById("form").hidden = true;
} else {
  who.innerHTML = "";
  const b = document.createElement("b");
  b.textContent = name;
  who.append(b, "이(가) 캔버스 노트에 연결하려고 해요.", document.createElement("br"),
    "연결이 끝나면 ", Object.assign(document.createElement("b"), { textContent: host }), "(으)로 돌아가요.");
}
const input = document.getElementById("code");
input.addEventListener("input", () => {
  const raw = input.value.toUpperCase().replace(/[^0-9A-Z]/g, "").slice(0, 8);
  input.value = raw.length > 4 ? raw.slice(0, 4) + "-" + raw.slice(4) : raw;
});
document.getElementById("cancel").onclick = () => {
  if (!redirect) return;
  const back = new URL(redirect);
  back.searchParams.set("error", "access_denied");
  if (params.get("state")) back.searchParams.set("state", params.get("state"));
  location.href = back.toString();
};
document.getElementById("form").onsubmit = async (e) => {
  e.preventDefault();
  const go = document.getElementById("go"), error = document.getElementById("error");
  go.disabled = true; error.textContent = "";
  try {
    const res = await fetch(MCP + "/claim", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: input.value, client_id: params.get("client_id"), redirect_uri: redirect,
        code_challenge: params.get("code_challenge"), state: params.get("state") }),
    });
    const body = await res.json();
    if (!res.ok || !body.redirect) throw new Error(body.error || "연결하지 못했어요");
    go.textContent = "연결됐어요 — 돌아가는 중…";
    location.href = body.redirect;
  } catch (err) {
    error.textContent = err.message;
    go.disabled = false;
  }
};
</script>
</body>
</html>
